[package]
name = "mk20dx-testsuite"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Tests that need a wire between two pins are gated on this feature, so a plain
# `cargo test` runs only what a bare board can pass.
[features]
loopback = []

[dependencies]
mk20dx-hal = { path = "../mk20dx-hal", features = ["mk20d7", "rt", "critical-section", "defmt"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
embedded-hal = "1.0"
embedded-hal-nb = "1.0"
embedded-io = "0.6"
nb = "1.1"
fugit = "0.3"
usb-device = "0.3"
embedded-storage = "0.3"

[dev-dependencies]
defmt-test = "0.3"
proptest = { git = "https://github.com/cosmikwolf/proptest.git", branch = "feat/defmt-format", default-features = false, features = ["no_std", "alloc", "defmt"] }
embedded-alloc = "0.6"

# Optimize dependencies in debug builds — critical for timing-sensitive
# peripheral sequences like the WDOG unlock (20 bus cycle window).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Keep existing bin
[[bin]]
name = "hello"
test = false

# Self-test binaries (no external wiring)
[[test]]
name = "watchdog"
harness = false
[[test]]
name = "clocks"
harness = false
[[test]]
name = "gpio"
harness = false
[[test]]
name = "delay"
harness = false
[[test]]
name = "timer"
harness = false
[[test]]
name = "adc"
harness = false
[[test]]
name = "dma"
harness = false
[[test]]
name = "pwm"
