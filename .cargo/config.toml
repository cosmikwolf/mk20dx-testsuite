[target.thumbv7em-none-eabi]
# probe-runner.sh wraps probe-rs with --connect-under-reset, which the Kinetis
# needs to survive the flash erase, and retries a failed SWD handshake.
runner = "./probe-runner.sh"
# runner = "./jlink-runner.sh"

[build]
target = "thumbv7em-none-eabi"

[env]
DEFMT_LOG = "debug"
# Which probe to use, as VID:PID:SERIAL. Needed once more than one is plugged
# in; `probe-rs list` prints the selector for each. Override in the environment
# to run against a different probe.
PROBE_SELECTOR = "1366:0105:000600109129"
